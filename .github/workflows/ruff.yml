name: Ruff

# Free Python lint review: pycodestyle errors + pyflakes on the backend.
# Rules live in backend/pyproject.toml (tight set on purpose — see comments).
on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install "ruff==0.16.9"

      - name: Lint backend
        run: ruff check backend/app
